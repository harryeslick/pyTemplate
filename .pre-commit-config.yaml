# Paths never checked: scratch script, generated docs, data, and JSON blobs.
exclude: '^dev\.py$|^docs/.*|^data/.*|.*\.json$|^uv\.lock$'

# Stage names below use the modern spelling (pre-commit >= 3.2):
# "commit" -> "pre-commit", "push" -> "pre-push".
default_stages: [pre-commit]
# Keep hook envs off the bleeding edge of whatever python happens to be on PATH.
default_language_version:
  python: python3

repos:
  # Standard pre-commit hooks for general file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Remove trailing whitespace from lines
      - id: trailing-whitespace
      # Ensure files end with a single newline
      - id: end-of-file-fixer
      # Normalize line endings to LF
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Validate TOML / YAML syntax
      - id: check-toml
      - id: check-yaml
      # Prevent committing files larger than 1MB
      - id: check-added-large-files
        args: ['--maxkb=1024']
      # Verify Python files have valid syntax
      - id: check-ast
      # Prevent accidental use of dict()/list()/tuple() instead of {}/[]/()
      - id: check-builtin-literals
      # Ensure docstrings appear before code in modules/classes/functions
      - id: check-docstring-first
      # Detect merge conflict markers
      - id: check-merge-conflict
      # Detect case conflicts in filenames (case-insensitive filesystems)
      - id: check-case-conflict
      # Reject filenames that are invalid on Windows (NUL, CON, trailing dots)
      - id: check-illegal-windows-names
      # Detect broken symlinks
      - id: check-symlinks
      # Detect debug statements (pdb, ipdb, breakpoint)
      - id: debug-statements
      # Block accidentally committed private keys
      - id: detect-private-key

  # Ruff: Python linter and formatter (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # NOTE: the linter hook is "ruff-check" since ruff v0.12; "ruff" is deprecated.
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes"]
      - id: ruff-format

  # uv: keep uv.lock in sync with pyproject.toml so CI never resolves a
  # different dependency set than the one that was committed.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  # codespell: common misspellings. Options live in .codespellrc (write = true).
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # pygrep-hooks: fast regex-based Python checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # Require specific error codes on suppressions
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      # Prevent deprecated logging.warn (use logging.warning instead)
      - id: python-no-log-warn
      # Prevent use of eval()
      - id: python-no-eval
      # Enforce annotations over `# type:` comments
      - id: python-use-type-annotations

  - repo: local
    hooks:
      - id: claude-worklog
        name: Claude session worklog
        entry: .claude/hooks/pre-commit
        language: script
        files: '^\.claude/' # only run if there are changes in .claude/
        pass_filenames: false
